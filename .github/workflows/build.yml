name: Build APK

# Builds the Flutter app and uploads the release APK as a workflow
# artifact. Pushes a v* tag additionally publishes a GitHub Release
# with the APK attached. Release builds are debug-key signed by
# Flutter when no signing config exists, so artifacts sideload directly.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only for the tag Release step

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore signing key
        # The keystore and its password live in repo secrets (the repo
        # is public; the key must never be committed). Restoring the
        # same key on every run is what makes updates installable.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=audiobooks"
            echo "storeFile=release.keystore"
          } > android/key.properties

      - name: Build release APK
        # The Gradle plugin portal intermittently 404s the Kotlin plugin
        # artifacts on first request (seen on v0.2.2, v0.2.5, v0.2.6 first
        # attempts; re-runs always succeeded). Retry in-run instead of
        # failing the whole build on a download flake.
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "Build failed after 4 attempts"
          exit 1

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          NAME="EmbyAudiobookPlayer-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyAudiobookPlayer-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
