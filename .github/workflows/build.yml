name: Build APK

# Builds the Flutter app and uploads the release APK as a workflow
# artifact. Pushes a v* tag additionally publishes a GitHub Release
# with the APK attached. Release builds are signed with the
# permanent keystore restored from repo secrets (see the Restore
# signing key step), so every build installs over the previous one.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only for the tag Release step

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        # --no-fatal-infos: the codebase carries 12 known info-level
        # lints; plain `flutter analyze` exits 1 on infos too, which
        # would leave this gate red from day one. Errors and warnings
        # still fail the job.
        run: flutter analyze --no-fatal-infos

  build:
    needs: [check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Add Maven Central fallback for plugin dependencies
        # plugins.gradle.org intermittently 404s the Kotlin plugin
        # artifacts for whole stretches (it burned every retry of the
        # v0.3.0/v0.3.1 first runs). The same artifacts exist on Maven
        # Central; this init script gives every Gradle build in the
        # composite (including Flutter's own gradle project, whose
        # buildscript classpath is what kept failing) Central and
        # Google as additional plugin/dependency repositories.
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/init.gradle.kts <<'EOF'
          beforeSettings {
              pluginManagement {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          EOF

      - name: Restore signing key
        if: github.event_name != 'pull_request'
        # The keystore and its password live in repo secrets (the repo
        # is public; the key must never be committed). Restoring the
        # same key on every run is what makes updates installable.
        # Skipped on pull-request builds: PR builds fall back to debug
        # signing (see build.gradle.kts) and never touch the real key.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/release.keystore
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=audiobooks"
            echo "storeFile=release.keystore"
          } > android/key.properties

      - name: Build release APK
        # The Gradle plugin portal intermittently 404s the Kotlin plugin
        # artifacts on first request (seen on v0.2.2, v0.2.5, v0.2.6 first
        # attempts; re-runs always succeeded). Retry in-run instead of
        # failing the whole build on a download flake.
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --release; then
              exit 0
            fi
            echo "Build attempt $attempt failed; retrying in 60s..."
            sleep 60
          done
          echo "Build failed after 4 attempts"
          exit 1

      - name: Name the APK
        id: apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          NAME="EmbyAudiobookPlayer-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EmbyAudiobookPlayer-v${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
          generate_release_notes: true
